<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprite Generator & Animator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Pixel Sprite Generator & Animator</h1>
        
        <div class="controls">
            <div class="input-group">
                <label for="sprite-prompt">Describe your sprite:</label>
                <input type="text" id="sprite-prompt" placeholder="A pixel art character with a red hat and blue overalls">
            </div>
            <button id="generate-btn">Generate Sprite</button>
        </div>
        
        <div class="display-area">
            <div class="sprite-display">
                <h2>Generated Sprite</h2>
                <div id="sprite-container">
                    <img id="sprite-image" style="display: none;">
                    <div id="loading-sprite" style="display: none;">Generating sprite...</div>
                </div>
            </div>
            
            <div class="animation-display" style="display: none;">
                <h2>Animation Preview</h2>
                <div id="animation-container"></div>
                <div id="animation-frames"></div>
                <div id="animation-controls">
                    <button id="animate-btn">Animate Sprite</button>
                    <div id="loading-animation" style="display: none;">Analyzing sprite for animation...</div>
                </div>
            </div>
        </div>
        
        <div class="game-container" style="display: none;">
            <h2>Game Preview</h2>
            <div id="game-canvas-container">
                <canvas id="game-canvas" width="800" height="400"></canvas>
            </div>
            <div class="game-controls">
                <p>Use arrow keys to move the character</p>
                <button id="start-game-btn">Start Game</button>
            </div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "pixi.js": "https://cdn.jsdelivr.net/npm/pixi.js@7.3.2/dist/pixi.min.js"
        }
    }
    </script>
    <script src="script.js" type="module"></script>

</body>
</html>
